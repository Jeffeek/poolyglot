version: 2

updates:
  # .NET / NuGet
  - package-ecosystem: nuget
    directory: /csharp
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - dotnet
    groups:
      dotnet-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  # Rust / Cargo
  - package-ecosystem: cargo
    directory: /rust
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - rust
    groups:
      rust-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  # Java / Maven
  - package-ecosystem: maven
    directory: /java
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - java
    groups:
      java-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  # Go / Go Modules
  - package-ecosystem: gomod
    directory: /go
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - go
    groups:
      go-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  # TypeScript / npm
  - package-ecosystem: npm
    directory: /typescript
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - typescript
    groups:
      npm-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  # Python / pip
  - package-ecosystem: pip
    directory: /python
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - python
    groups:
      python-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - github-actions
    groups:
      actions-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  - package-ecosystem: nuget
    directory: /csharp/examples
    schedule:
      interval: weekly

  - package-ecosystem: nuget
    directory: /csharp/src/ConnPool
    schedule:
      interval: weekly

  - package-ecosystem: nuget
    directory: /csharp/tests/ConnPool.Tests
    schedule:
      interval: weekly

  - package-ecosystem: gomod
    directory: /go/examples
    schedule:
      interval: weekly

  - package-ecosystem: nuget
    directory: /csharp/fuzz/ConnPool.Fuzz
    schedule:
      interval: weekly
