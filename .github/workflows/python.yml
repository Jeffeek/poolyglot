name: python

on:
  push:
    paths: ["python/**", ".github/workflows/python.yml"]
  pull_request:
    paths: ["python/**", ".github/workflows/python.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: python

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (with dev extras)
        run: pip install -e ".[dev]"
      - name: Tests + coverage gate (fail_under=100 in pyproject)
        run: |
          coverage run -m unittest discover -s tests -t .
          coverage report
      - name: Type check
        run: mypy

      # Upload coverage once (all versions are identical at 100%); flag=python keeps it
      # separate from the C# flag on Codecov.
      - name: Coverage XML
        if: matrix.python-version == '3.12'
        run: coverage xml
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: python/coverage.xml
          flags: python
          name: python
          fail_ci_if_error: false
