name: python

on:
  push:
    branches: [main]
    paths: ["python/**", ".github/workflows/python.yml"]
  pull_request:
    paths: ["python/**", ".github/workflows/python.yml"]

permissions:
  contents: read

# A newer commit on the same ref cancels in-flight runs (PRs only; never cancel a main run).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: python

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          use-policy-store: true
          api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (hash-pinned dev tooling + editable package)
        run: |
          pip install --require-hashes -r requirements-dev.txt
          pip install -e . --no-deps
      - name: Tests + coverage gate (fail_under=100 in pyproject)
        run: |
          coverage run -m unittest discover -s tests -t .
          coverage report
      - name: Type check
        run: mypy
      - name: Run examples
        run: |
          python examples/monitoring/prometheus_metrics.py
          python examples/registry/multi_tenant.py
          python examples/registry/regional_failover.py
          python examples/observability/lifecycle_logger.py

      # Upload coverage once (all versions are identical at 100%); flag=python keeps it
      # separate from the C# flag on Codecov.
      - name: Coverage XML
        if: matrix.python-version == '3.12'
        run: coverage xml
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: step-security/codecov-action@367bf7e789f1b8e452a759be81c791de8d69b2f6 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: python/coverage.xml
          flags: python
          name: python
          fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          use-policy-store: true
          api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install (hash-pinned dev tooling + editable package)
        run: |
          pip install --require-hashes -r requirements-dev.txt
          pip install -e . --no-deps
      - name: Lint gate (ruff bug / dead-code rules)
        run: ruff check --select F,B src tests
      - name: Style + format (warn-only)
        continue-on-error: true
        run: |
          ruff check --output-format=github src tests
          ruff format --check src tests
