name: rust

on:
  push:
    paths: ["rust/**", ".github/workflows/rust.yml"]
  pull_request:
    paths: ["rust/**", ".github/workflows/rust.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: rust

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # MSRV (edition 2024 floor) + stable. Keep MSRV first so coverage uploads from it.
        rust: ["1.85.0", "stable"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Rust ${{ matrix.rust }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: llvm-tools-preview
      - name: Build (blocking library, zero deps)
        run: cargo build
      - name: Build (with async pool)
        run: cargo build --features tokio
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      # run_tests.sh runs the suite under --all-features and writes lcov.info (gate: 100% lines).
      - name: Tests + coverage gate (100% lines)
        run: bash run_tests.sh

      - name: Upload coverage to Codecov
        if: matrix.rust == '1.85.0'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: rust/lcov.info
          flags: rust
          name: rust
          fail_ci_if_error: false
