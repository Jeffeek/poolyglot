name: rust

on:
  push:
    branches: [main]
    paths: ["rust/**", ".github/workflows/rust.yml"]
  pull_request:
    paths: ["rust/**", ".github/workflows/rust.yml"]

permissions:
  contents: read

# A newer commit on the same ref cancels in-flight runs (PRs only; never cancel a main run).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: rust

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # MSRV (edition 2024 floor) + stable. Keep MSRV first so coverage uploads from it.
        rust: ["1.85.0", "stable"]
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          use-policy-store: true
          api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Rust ${{ matrix.rust }}
        uses: step-security/dtolnay-rust-toolchain@8dd607977d06adf4ed49b190381e74c17a9dd25f # v1.0.0
        with:
          toolchain: ${{ matrix.rust }}
          components: llvm-tools-preview
      - name: Build (blocking library, zero deps)
        run: cargo build
      - name: Build (with async pool)
        run: cargo build --features tokio
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      # run_tests.sh runs the suite under --all-features and writes lcov.info (gate: 100% lines).
      - name: Tests + coverage gate (100% lines)
        run: bash run_tests.sh

      - name: Upload coverage to Codecov
        if: matrix.rust == '1.85.0'
        uses: step-security/codecov-action@367bf7e789f1b8e452a759be81c791de8d69b2f6 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: rust/lcov.info
          flags: rust
          name: rust
          fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          use-policy-store: true
          api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Rust
        uses: step-security/dtolnay-rust-toolchain@8dd607977d06adf4ed49b190381e74c17a9dd25f # v1.0.0
        with:
          toolchain: stable
          components: clippy, rustfmt
      - name: Lint gate (clippy, warnings as errors)
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Format check (warn-only)
        continue-on-error: true
        run: cargo fmt --check
