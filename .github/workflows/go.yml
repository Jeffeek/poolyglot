name: go

on:
  push:
    branches: [main]
    paths: ["go/**", ".github/workflows/go.yml"]
  pull_request:
    paths: ["go/**", ".github/workflows/go.yml"]

permissions:
  contents: read

# A newer commit on the same ref cancels in-flight runs (PRs only; never cancel a main run).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: go

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.21", "1.22", "1.23"]
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          use-policy-store: true
          api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
      - name: Build (library)
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Tests + coverage gate (100% statements)
        run: bash run_tests.sh
      - name: Build + run examples
        run: |
          cd examples
          go run ./monitoring/prometheus_metrics.go
          go run ./registry/multi_tenant/multi_tenant.go
          go run ./registry/regional_failover/regional_failover.go
          go run ./observability/lifecycle_logger.go

      # run_tests.sh writes coverage.out; flag=go keeps it separate from the other languages.
      - name: Upload coverage to Codecov
        if: matrix.go-version == '1.21'
        uses: step-security/codecov-action@367bf7e789f1b8e452a759be81c791de8d69b2f6 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: go/coverage.out
          flags: go
          name: go
          fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          use-policy-store: true
          api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: Lint gate (golangci-lint)
        uses: step-security/golangci-lint-action@2697867e9c204558ca23d0decdd0039dc21f2b93 # v9.3.0
        with:
          version: latest
          working-directory: go
      - name: Format check (warn-only)
        continue-on-error: true
        run: |
          out=$(gofmt -l .); if [ -n "$out" ]; then echo "Unformatted:"; echo "$out"; exit 1; fi
