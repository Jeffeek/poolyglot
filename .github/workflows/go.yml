name: go

on:
  push:
    branches: [main]
    paths: ["go/**", ".github/workflows/go.yml"]
  pull_request:
    paths: ["go/**", ".github/workflows/go.yml"]

permissions:
  contents: read

# A newer commit on the same ref cancels in-flight runs (PRs only; never cancel a main run).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: go

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.21", "1.22", "1.23"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
      - name: Build (library)
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Tests + coverage gate (100% statements)
        run: bash run_tests.sh

      # run_tests.sh writes coverage.out; flag=go keeps it separate from the other languages.
      - name: Upload coverage to Codecov
        if: matrix.go-version == '1.21'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: go/coverage.out
          flags: go
          name: go
          fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Lint gate (golangci-lint)
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          working-directory: go
      - name: Format check (warn-only)
        continue-on-error: true
        run: |
          out=$(gofmt -l .); if [ -n "$out" ]; then echo "Unformatted:"; echo "$out"; exit 1; fi
