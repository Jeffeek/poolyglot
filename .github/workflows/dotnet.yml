name: dotnet

on:
  push:
    branches: [main]
    paths: ["csharp/**", ".github/workflows/dotnet.yml"]
  pull_request:
    paths: ["csharp/**", ".github/workflows/dotnet.yml"]

permissions:
  contents: read

# A newer commit on the same ref cancels in-flight runs (PRs only; never cancel a main run).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: csharp

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          use-policy-store: true
          api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Build (library, netstandard2.1)
        run: dotnet build src/ConnPool/ConnPool.csproj -c Release
      - name: Tests + coverage gate (100% line)
        run: bash run_tests.sh

      # run_tests.sh writes cobertura per target framework; flag=csharp keeps it separate
      # from the Python flag on Codecov.
      - name: Upload coverage to Codecov
        uses: step-security/codecov-action@367bf7e789f1b8e452a759be81c791de8d69b2f6 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: csharp/tests/ConnPool.Tests/coverage
          flags: csharp
          name: csharp
          fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          use-policy-store: true
          api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Lint gate (Roslyn analyzers as errors)
        run: dotnet build src/ConnPool/ConnPool.csproj -c Release -warnaserror
      - name: Format check (warn-only)
        continue-on-error: true
        run: dotnet format ConnPool.sln --verify-no-changes
