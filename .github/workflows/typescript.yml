name: typescript

on:
  push:
    branches: [main]
    paths: ["typescript/**", ".github/workflows/typescript.yml"]
  pull_request:
    paths: ["typescript/**", ".github/workflows/typescript.yml"]

permissions:
  contents: read

# A newer commit on the same ref cancels in-flight runs (PRs only; never cancel a main run).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: typescript

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24", "26"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      # package-lock.json is not committed (see typescript/.gitignore), so use `npm install`.
      - name: Install dependencies
        run: npm install
      - name: Build (library, ESM + types)
        run: npm run build
      - name: Type check
        run: npm run typecheck
      - name: Tests + coverage gate (100% line + branch)
        run: bash run_tests.sh

      # run_tests.sh writes coverage/lcov.info; flag=typescript keeps it separate from the others.
      - name: Upload coverage to Codecov
        if: matrix.node-version == '22'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: typescript/coverage/lcov.info
          flags: typescript
          name: typescript
          fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install
      - name: Lint gate (Biome)
        run: npm run lint
      - name: Format check (warn-only)
        continue-on-error: true
        run: npm run format:check
