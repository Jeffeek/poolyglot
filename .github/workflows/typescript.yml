name: typescript

on:
  push:
    paths: ["typescript/**", ".github/workflows/typescript.yml"]
  pull_request:
    paths: ["typescript/**", ".github/workflows/typescript.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: typescript

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24", "26"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      # package-lock.json is not committed (see typescript/.gitignore), so use `npm install`.
      - name: Install dependencies
        run: npm install
      - name: Build (library, ESM + types)
        run: npm run build
      - name: Type check
        run: npm run typecheck
      - name: Tests + coverage gate (100% line + branch)
        run: bash run_tests.sh

      # run_tests.sh writes coverage/lcov.info; flag=typescript keeps it separate from the others.
      - name: Upload coverage to Codecov
        if: matrix.node-version == '22'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: typescript/coverage/lcov.info
          flags: typescript
          name: typescript
          fail_ci_if_error: false
