name: typescript

on:
  push:
    branches: [main]
    paths: ["typescript/**", ".github/workflows/typescript.yml"]
  pull_request:
    paths: ["typescript/**", ".github/workflows/typescript.yml"]

permissions:
  contents: read

# A newer commit on the same ref cancels in-flight runs (PRs only; never cancel a main run).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: typescript

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24", "26"]
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          use-policy-store: true
          api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
      # package-lock.json is committed, so `npm ci` installs the pinned tree reproducibly.
      - name: Install dependencies
        run: npm ci
      - name: Build (library, ESM + types)
        run: npm run build
      - name: Type check
        run: npm run typecheck
      - name: Tests + coverage gate (100% line + branch)
        run: bash run_tests.sh
      - name: Build + check examples
        run: |
          npx tsx --no-warnings examples/monitoring/prometheus_metrics.ts
          npx tsx --no-warnings examples/registry/multi_tenant.ts
          npx tsx --no-warnings examples/registry/regional_failover.ts
          npx tsx --no-warnings examples/observability/lifecycle_logger.ts

      # run_tests.sh writes coverage/lcov.info; flag=typescript keeps it separate from the others.
      - name: Upload coverage to Codecov
        if: matrix.node-version == '22'
        uses: step-security/codecov-action@367bf7e789f1b8e452a759be81c791de8d69b2f6 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: typescript/coverage/lcov.info
          flags: typescript
          name: typescript
          fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          use-policy-store: true
          api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci
      - name: Lint gate (Biome)
        run: npm run lint
      - name: Format check (warn-only)
        continue-on-error: true
        run: npm run format:check
