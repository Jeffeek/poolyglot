name: fuzz (go)

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:
    inputs:
      fuzz-seconds:
        description: "Seconds to run each fuzz target"
        default: "120"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          use-policy-store: true
          api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.23"

      - name: Fuzz
        working-directory: go
        env:
          FUZZ_SECONDS: ${{ github.event.inputs.fuzz-seconds || '120' }}
        run: |
          for target in FuzzDelayFor FuzzBreakerSequence FuzzPoolSequence FuzzAsyncPoolSequence; do
            echo "::group::$target (${FUZZ_SECONDS}s)"
            go test -run '^$' -fuzz="^${target}$" -fuzztime="${FUZZ_SECONDS}s" .
            echo "::endgroup::"
          done

      - name: Upload fuzz crashers
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-fuzz-crashers
          path: go/testdata/fuzz/**
