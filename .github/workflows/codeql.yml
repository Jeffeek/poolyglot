name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 2 * * 1" # weekly, Mondays 02:30 UTC

# Don't pile up redundant scans: a newer push to the same ref cancels in-flight runs.
# (Scheduled runs are never cancelled — they key off the unique run id.)
concurrency:
  group: codeql-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      security-events: write # upload results to the Security tab
      actions: read # required by CodeQL to read workflow run metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
          - language: javascript-typescript # CodeQL's identifier for the JS/TS family
            build-mode: none
          - language: csharp
            build-mode: manual
          - language: java-kotlin # CodeQL's identifier for the JVM family
            build-mode: manual
          - language: go
            build-mode: manual
          - language: rust
            build-mode: none
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          use-policy-store: true
          api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # --- per-language toolchain (only the compiled languages need one to build) ---
      - name: Set up .NET
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Set up JDK 17
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable # CodeQL just needs a working toolchain; go.mod pins the language level

      # --- CodeQL: deeper security suite + skip tests/examples/build output noise ---
      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
          # paths-ignore only applies to the interpreted extractors (python, javascript-typescript);
          # the compiled languages analyze whatever their build compiles.
          config: |
            paths-ignore:
              - '**/test/**'
              - '**/tests/**'
              - '**/examples/**'
              - '**/dist/**'
              - '**/*.test.ts'

      # --- manual builds for the compiled languages (build-mode: manual) ---
      - name: Build (csharp)
        if: matrix.language == 'csharp'
        run: dotnet build src/ConnPool/ConnPool.csproj -c Release
        working-directory: csharp

      - name: Build (java)
        if: matrix.language == 'java-kotlin'
        run: mvn -q -B -DskipTests package
        working-directory: java

      - name: Build (go)
        if: matrix.language == 'go'
        run: go build ./...
        working-directory: go

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:${{ matrix.language }}"
