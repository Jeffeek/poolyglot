name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 2 * * 1" # weekly, Mondays 02:30 UTC

# Don't pile up redundant scans: a newer push to the same ref cancels in-flight runs.
# (Scheduled runs are never cancelled — they key off the unique run id.)
concurrency:
  group: codeql-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Decide which languages CodeQL analyzes. push-to-main and the weekly schedule
  # always scan the FULL matrix (security baseline). On PRs we scan only the
  # languages whose folders changed — or the full matrix if this workflow file
  # itself changed. This keeps PR CI from rebuilding/reanalyzing 5 untouched
  # languages on a single-folder change.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      languages: ${{ steps.langs.outputs.languages }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          use-policy-store: true
          api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect changed language folders (PRs only)
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # Filter keys ARE the CodeQL language identifiers (so outputs.changes
          # feeds straight into the matrix). 'all' is a sentinel: a change to this
          # workflow file forces a full scan.
          filters: |
            python: ['python/**']
            javascript-typescript: ['typescript/**']
            csharp: ['csharp/**']
            java-kotlin: ['java/**']
            go: ['go/**']
            rust: ['rust/**']
            all: ['.github/workflows/codeql.yml']

      - name: Compute language matrix
        id: langs
        env:
          EVENT: ${{ github.event_name }}
          CHANGES: ${{ steps.filter.outputs.changes }}
        run: |
          full='["python","javascript-typescript","csharp","java-kotlin","go","rust"]'
          if [ "$EVENT" != "pull_request" ]; then
            echo "languages=$full" >> "$GITHUB_OUTPUT"
          elif printf '%s' "$CHANGES" | grep -q '"all"'; then
            echo "languages=$full" >> "$GITHUB_OUTPUT"
          else
            echo "languages=$CHANGES" >> "$GITHUB_OUTPUT"
          fi

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: changes
    if: needs.changes.outputs.languages != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      security-events: write # upload results to the Security tab
      actions: read # required by CodeQL to read workflow run metadata
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.changes.outputs.languages) }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          use-policy-store: true
          api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # --- per-language toolchain (only the compiled languages need one to build) ---
      - name: Set up .NET
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Set up JDK 17
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable # CodeQL just needs a working toolchain; go.mod pins the language level

      # --- CodeQL: deeper security suite + skip tests/examples/build output noise ---
      # build-mode is derived from the language: the compiled languages build manually below.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ (matrix.language == 'csharp' || matrix.language == 'java-kotlin' || matrix.language == 'go') && 'manual' || 'none' }}
          queries: security-extended
          # paths-ignore only applies to the interpreted extractors (python, javascript-typescript);
          # the compiled languages analyze whatever their build compiles.
          config: |
            paths-ignore:
              - '**/test/**'
              - '**/tests/**'
              - '**/examples/**'
              - '**/dist/**'
              - '**/*.test.ts'

      # --- manual builds for the compiled languages (build-mode: manual) ---
      - name: Build (csharp)
        if: matrix.language == 'csharp'
        run: dotnet build src/ConnPool/ConnPool.csproj -c Release
        working-directory: csharp

      - name: Build (java)
        if: matrix.language == 'java-kotlin'
        run: mvn -q -B -DskipTests package
        working-directory: java

      - name: Build (go)
        if: matrix.language == 'go'
        run: go build ./...
        working-directory: go

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:${{ matrix.language }}"

  # Single aggregated status check. It ALWAYS runs, so a conditionally-skipped
  # language leg never leaves a required check stuck 'pending'. Make THIS job
  # ("codeql") the required status check in branch protection — not the
  # per-language "Analyze (...)" legs. Passes when analyze succeeded or was
  # legitimately skipped (no language folders changed); fails only on real failure.
  codeql:
    name: codeql
    needs: [changes, analyze]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          use-policy-store: true
          api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

      - name: Require successful (or skipped) analysis
        env:
          RESULT: ${{ needs.analyze.result }}
        run: |
          if [ "$RESULT" = "failure" ] || [ "$RESULT" = "cancelled" ]; then
            echo "CodeQL analysis did not pass (analyze result: $RESULT)"
            exit 1
          fi
          echo "CodeQL gate passed (analyze result: $RESULT)"
