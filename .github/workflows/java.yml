name: java

on:
  push:
    branches: [main]
    paths: ["java/**", ".github/workflows/java.yml"]
  pull_request:
    paths: ["java/**", ".github/workflows/java.yml"]

permissions:
  contents: read

# A newer commit on the same ref cancels in-flight runs (PRs only; never cancel a main run).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: java

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build (library)
        run: mvn -q -B -DskipTests package
      - name: Tests + coverage gate (100% line & branch)
        run: bash run_tests.sh

      # JaCoCo writes jacoco.xml; flag=java keeps it separate from the other languages.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: java/target/site/jacoco/jacoco.xml
          flags: java
          name: java
          fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Lint gate (SpotBugs, high confidence)
        run: mvn -q -B -DskipTests compile spotbugs:check
      - name: Format check (warn-only)
        continue-on-error: true
        run: mvn -q -B spotless:check
