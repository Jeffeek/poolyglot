name: java

on:
  push:
    branches: [main]
    paths: ["java/**", ".github/workflows/java.yml"]
  pull_request:
    paths: ["java/**", ".github/workflows/java.yml"]

permissions:
  contents: read

# A newer commit on the same ref cancels in-flight runs (PRs only; never cancel a main run).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: java

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          use-policy-store: true
          api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build (library)
        run: mvn -q -B -DskipTests package
      - name: Tests + coverage gate (100% line & branch)
        run: bash run_tests.sh

      # JaCoCo writes jacoco.xml; flag=java keeps it separate from the other languages.
      - name: Upload coverage to Codecov
        uses: step-security/codecov-action@367bf7e789f1b8e452a759be81c791de8d69b2f6 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: java/target/site/jacoco/jacoco.xml
          flags: java
          name: java
          fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          use-policy-store: true
          api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Lint gate (SpotBugs, high confidence)
        run: mvn -q -B -DskipTests compile spotbugs:check
      - name: Format check (warn-only)
        continue-on-error: true
        run: mvn -q -B spotless:check
