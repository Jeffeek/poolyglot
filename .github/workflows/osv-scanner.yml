name: OSV-Scanner

on:
  pull_request:
    branches: [ "main" ]
  merge_group:
    branches: [ "main" ]
  schedule:
    - cron: '20 5 * * 2'
  push:
    branches: [ "main" ]

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  scan-scheduled:
    if: ${{ github.event_name == 'push' || github.event_name == 'schedule' }}
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@0a65f82af05cd58cf587827b0bb0489548c18346" # v2.7.0
    with:
      scan-args: |-
        -r
        ./

  scan-pr:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@0a65f82af05cd58cf587827b0bb0489548c18346" # v2.7.0
    with:
      scan-args: |-
        -r
        ./
