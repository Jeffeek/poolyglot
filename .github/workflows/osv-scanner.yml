name: OSV-Scanner

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - "**/package.json"
      - "**/pom.xml"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "**/go.mod"
      - "**/go.sum"
      - "**/*.csproj"
      - "**/pyproject.toml"
      - "**/requirements*.txt"
      - ".github/workflows/osv-scanner.yml"
  merge_group:
    branches: [ "main" ]
  schedule:
    - cron: '20 5 * * 2'
  push:
    branches: [ "main" ]
    paths:
      - "**/package.json"
      - "**/pom.xml"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "**/go.mod"
      - "**/go.sum"
      - "**/*.csproj"
      - "**/pyproject.toml"
      - "**/requirements*.txt"
      - ".github/workflows/osv-scanner.yml"

permissions:
  actions: read
  contents: read
  security-events: write

# A newer commit on the same ref cancels in-flight runs (PRs only; never cancel a main run).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scan-scheduled:
    if: ${{ github.event_name == 'push' || github.event_name == 'schedule' }}
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@0a65f82af05cd58cf587827b0bb0489548c18346" # v2.7.0
    with:
      scan-args: |-
        -r
        ./

  scan-pr:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@0a65f82af05cd58cf587827b0bb0489548c18346" # v2.7.0
    with:
      scan-args: |-
        -r
        ./
