name: release

# Fires when release.sh pushes a v<version> tag. One job per language:
# build -> test -> verify -> publish, then a final github-release job attaches every
# language's built artifacts to the GitHub Release. The version comes from the tag,
# checked against the root VERSION file. To add a language, copy the python job, swap
# the working-directory and the build/test/publish steps for that toolchain, and add its
# dist to the github-release job via actions/upload-artifact.
on:
  push:
    tags: ["v*"]

jobs:
  python:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/connpool
    permissions:
      id-token: write
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The tag is the source of truth; it must agree with the committed VERSION.
      - name: Check tag matches VERSION
        working-directory: .
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          FILE="$(cat VERSION)"
          [ "$VERSION" = "$FILE" ] || { echo "tag ${GITHUB_REF_NAME} != VERSION ${FILE}"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install (dev + build tools)
        run: pip install -e ".[dev]" build twine

      # --- test ---
      - name: Tests + coverage gate (fail_under=100 in pyproject)
        run: |
          coverage run -m unittest discover -s tests -t .
          coverage report
      - name: Type check
        run: mypy

      # --- verify the committed version matches the tag (release.sh sets it), then build ---
      - name: Check pyproject version matches tag
        run: |
          PV="$(sed -nE 's/^version = "(.*)"/\1/p' pyproject.toml | head -1)"
          [ "$PV" = "$VERSION" ] || { echo "pyproject version ${PV} != tag ${VERSION} (run release.sh)"; exit 1; }
      - name: Build sdist + wheel
        run: python -m build

      # --- verify ---
      - name: Verify artifacts
        run: |
          twine check dist/*
          ls dist/ | grep -q "connpool-${VERSION}-" || { echo "built wheel is not version ${VERSION}"; exit 1; }

      # --- dry run: publish to TestPyPI first
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist
          repository-url: https://test.pypi.org/legacy/

      # Each publish signs dist/ in place, leaving *.publish.attestation behind;
      # clear them so the PyPI step generates its own instead of erroring on dupes.
      - name: Clear TestPyPI attestations
        run: rm -f dist/*.publish.attestation

      # --- publish ---
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist

      # Hand the built distributions to the github-release job (not the signing attestations).
      - name: Upload artifacts for the GitHub Release
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: |
            python/dist/*.whl
            python/dist/*.tar.gz

  # C# / .NET: build -> test -> pack -> verify -> publish to NuGet (with a GitHub Packages dry run).
  # This is the template for any other language: swap working-directory and the toolchain steps.
  dotnet:
    runs-on: ubuntu-latest
    environment:
      name: nuget
      url: https://www.nuget.org/packages/ConnPool
    permissions:
      contents: read
      packages: write          # for the GitHub Packages dry run
      id-token: write          # for NuGet trusted publishing (OIDC token exchange)
    defaults:
      run:
        working-directory: csharp
    steps:
      - uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # The tag is the source of truth; it must agree with the committed VERSION.
      - name: Check tag matches VERSION
        working-directory: .
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          FILE="$(cat VERSION)"
          [ "$VERSION" = "$FILE" ] || { echo "tag ${GITHUB_REF_NAME} != VERSION ${FILE}"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # --- verify the committed version matches the tag (release.sh sets it) ---
      - name: Check ConnPool.csproj version matches tag
        run: |
          CV="$(grep -oE '<Version>[^<]+</Version>' src/ConnPool/ConnPool.csproj | sed -E 's|</?Version>||g')"
          [ "$CV" = "$VERSION" ] || { echo "csproj version ${CV} != tag ${VERSION} (run release.sh)"; exit 1; }

      # --- build + test ---
      - name: Build (library, netstandard2.1)
        run: dotnet build src/ConnPool/ConnPool.csproj -c Release
      - name: Tests + coverage gate (100% line)
        run: bash run_tests.sh

      # --- pack (version comes from the verified csproj) ---
      - name: Pack (nupkg + snupkg)
        run: dotnet pack src/ConnPool/ConnPool.csproj -c Release -o dist

      # --- verify ---
      - name: Verify artifacts
        run: |
          ls -l dist
          ls dist | grep -q "ConnPool.${VERSION}.nupkg" || { echo "built package is not version ${VERSION}"; exit 1; }

      # --- publish to GitHub Packages (populates the repo's Packages tab; also a pre-flight
      #     check that the package pushes cleanly before the real nuget.org publish) ---
      - name: Publish to GitHub Packages
        run: >
          dotnet nuget push "dist/*.nupkg"
          --source "https://nuget.pkg.github.com/${GITHUB_REPOSITORY_OWNER}/index.json"
          --api-key "${{ secrets.GITHUB_TOKEN }}"
          --skip-duplicate

      # --- publish: trusted publishing (OIDC) - no long-lived API key stored ---
      # Exchange the GitHub OIDC token for a short-lived nuget.org key, done right before
      # the push (the key is valid ~1h). Requires a trusted-publishing policy on nuget.org
      - name: NuGet login (OIDC -> short-lived API key)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}   # nuget.org profile name that owns the policy

      - name: Publish to NuGet
        run: >
          dotnet nuget push "dist/*.nupkg"
          --source "https://api.nuget.org/v3/index.json"
          --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          --skip-duplicate

      # Hand the packages (and symbols) to the github-release job.
      - name: Upload artifacts for the GitHub Release
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-dist
          path: |
            csharp/dist/*.nupkg
            csharp/dist/*.snupkg

  # Java / Maven: build -> test -> package (jar+sources+javadoc, GPG-signed) -> verify -> publish
  # to Maven Central via the Central Portal (with a GitHub Packages dry run). Cloned from the dotnet
  # job. Maven Central has no OIDC/trusted-publishing yet, so this uses a Portal user token.
  java:
    runs-on: ubuntu-latest
    environment:
      name: maven
      url: https://central.sonatype.com/artifact/io.github.jeffeek/connpool
    permissions:
      contents: read
      packages: write          # for the GitHub Packages dry run
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # The tag is the source of truth; it must agree with the committed VERSION.
      - name: Check tag matches VERSION
        working-directory: .
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          FILE="$(cat VERSION)"
          [ "$VERSION" = "$FILE" ] || { echo "tag ${GITHUB_REF_NAME} != VERSION ${FILE}"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # --- verify the committed version matches the tag (release.sh sets it) ---
      - name: Check pom.xml version matches tag
        run: |
          PV="$(mvn -q -N help:evaluate -Dexpression=project.version -DforceStdout)"
          [ "$PV" = "$VERSION" ] || { echo "pom version ${PV} != tag ${VERSION} (run release.sh)"; exit 1; }

      # --- build + test ---
      - name: Tests + coverage gate (100% line & branch)
        run: bash run_tests.sh

      # --- settings.xml with both publishing servers + import the signing key ---
      - name: Configure Maven servers + GPG
        env:
          CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          GPG_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings>
            <servers>
              <server><id>central</id><username>\${env.CENTRAL_USERNAME}</username><password>\${env.CENTRAL_PASSWORD}</password></server>
              <server><id>github</id><username>${GITHUB_ACTOR}</username><password>${{ secrets.GITHUB_TOKEN }}</password></server>
            </servers>
          </settings>
          EOF
          echo "$GPG_KEY" | gpg --batch --import

      # --- package the signed artifacts (version comes from the verified pom) ---
      - name: Package (jar + sources + javadoc, signed)
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: mvn -q -B -Prelease -DskipTests package

      # --- verify ---
      - name: Verify artifacts
        run: |
          ls -l target
          ls target | grep -q "connpool-${VERSION}.jar" || { echo "built jar is not version ${VERSION}"; exit 1; }

      # --- dry run: publish to GitHub Packages (pre-flight that the artifacts push cleanly) ---
      - name: Publish to GitHub Packages
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: mvn -q -B -Prelease -DskipTests deploy

      # --- publish to Maven Central via the Central Portal (token auth; no OIDC yet) ---
      # CENTRAL_USERNAME/PASSWORD must be present on THIS step: settings.xml resolves the
      # `central` server creds from ${env.*} when `deploy` runs, not when settings.xml is written.
      - name: Publish to Maven Central
        env:
          CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: mvn -q -B -Prelease,central -DskipTests deploy

      # Hand the built jars to the github-release job.
      - name: Upload artifacts for the GitHub Release
        uses: actions/upload-artifact@v4
        with:
          name: java-dist
          path: |
            java/target/connpool-${{ env.VERSION }}.jar
            java/target/connpool-${{ env.VERSION }}-sources.jar
            java/target/connpool-${{ env.VERSION }}-javadoc.jar

  # Go / modules: build -> test -> verify. Go has NO registry upload and NO trusted publishing:
  # a module is "published" purely by its git tag (release.sh pushes go/v<version>, the version
  # tag the module proxy resolves for github.com/Jeffeek/poolyglot/go). This job verifies the tag
  # matches the committed version, builds, tests, and archives the module source for the Release.
  go:
    runs-on: ubuntu-latest
    environment:
      name: go
      url: https://pkg.go.dev/github.com/Jeffeek/poolyglot/go
    permissions:
      contents: read
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      # The tag is the source of truth; it must agree with the committed VERSION.
      - name: Check tag matches VERSION
        working-directory: .
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          FILE="$(cat VERSION)"
          [ "$VERSION" = "$FILE" ] || { echo "tag ${GITHUB_REF_NAME} != VERSION ${FILE}"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # --- verify the committed version constant matches the tag (release.sh sets it) ---
      - name: Check doc.go Version matches tag
        run: |
          GV="$(sed -nE 's/^const Version = "(.*)"/\1/p' doc.go | head -1)"
          [ "$GV" = "$VERSION" ] || { echo "go Version ${GV} != tag ${VERSION} (run release.sh)"; exit 1; }

      # --- build + test ---
      - name: Build (library)
        run: go build ./...
      - name: Tests + coverage gate (100% statements)
        run: bash run_tests.sh

      # --- archive the module source (the module itself is published by the go/v<version> git tag) ---
      - name: Archive module source
        working-directory: .
        run: |
          git archive --format=tar.gz --prefix="connpool-go-${VERSION}/" -o "connpool-go-${VERSION}.tar.gz" HEAD:go

      - name: Upload artifacts for the GitHub Release
        uses: actions/upload-artifact@v4
        with:
          name: go-dist
          path: connpool-go-${{ env.VERSION }}.tar.gz

  # TypeScript / npm: build -> test -> pack -> verify -> publish to npm via trusted publishing (OIDC),
  # with a `npm publish --dry-run` pre-flight. Cloned from the dotnet job. npm trusted publishing needs
  # npm >= 11.5.1 and `id-token: write`; no stored npm token.
  typescript:
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@jeffeek/connpool
    permissions:
      contents: read
      id-token: write          # for npm trusted publishing (OIDC)
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # The tag is the source of truth; it must agree with the committed VERSION.
      - name: Check tag matches VERSION
        working-directory: .
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          FILE="$(cat VERSION)"
          [ "$VERSION" = "$FILE" ] || { echo "tag ${GITHUB_REF_NAME} != VERSION ${FILE}"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # --- verify the committed version matches the tag (release.sh sets it) ---
      - name: Check package.json version matches tag
        run: |
          PV="$(node -p "require('./package.json').version")"
          [ "$PV" = "$VERSION" ] || { echo "package.json version ${PV} != tag ${VERSION} (run release.sh)"; exit 1; }

      # npm trusted publishing (OIDC) needs npm >= 11.5.1; Node 22 ships an older npm.
      - name: Upgrade npm (OIDC-capable)
        run: npm install -g npm@latest

      # --- install + build + test ---
      - name: Install dependencies
        run: npm install
      - name: Build (library, ESM + types)
        run: npm run build
      - name: Type check
        run: npm run typecheck
      - name: Tests + coverage gate (100% line + branch)
        run: bash run_tests.sh

      # --- pack (version comes from the verified package.json) ---
      - name: Pack (tarball)
        run: npm pack

      # --- verify ---
      - name: Verify artifact
        run: |
          ls -l
          test -f "jeffeek-connpool-${VERSION}.tgz" || { echo "built tarball is not version ${VERSION}"; exit 1; }

      # --- dry run: pack + validate the publishing without uploading ---
      - name: Publish dry run
        run: npm publish --dry-run --provenance --access public

      # --- publish: trusted publishing (OIDC) - no stored npm token ---
      - name: Publish to npm
        run: npm publish --provenance --access public

      # Hand the packed tarball to the github-release job.
      - name: Upload artifacts for the GitHub Release
        uses: actions/upload-artifact@v4
        with:
          name: typescript-dist
          path: typescript/jeffeek-connpool-${{ env.VERSION }}.tgz

  # Rust / crates.io: build -> test -> package -> verify -> publish via crates.io trusted
  # publishing (OIDC), with a `cargo publish --dry-run` pre-flight. Cloned from the dotnet job.
  # crates.io trusted publishing needs `id-token: write` and a trusted-publisher policy on
  # crates.io; no stored CARGO_REGISTRY_TOKEN.
  rust:
    runs-on: ubuntu-latest
    environment:
      name: crates
      url: https://crates.io/crates/connpool-rs
    permissions:
      contents: read
      id-token: write          # for crates.io trusted publishing (OIDC)
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85.0"
          components: llvm-tools-preview

      # The tag is the source of truth; it must agree with the committed VERSION.
      - name: Check tag matches VERSION
        working-directory: .
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          FILE="$(cat VERSION)"
          [ "$VERSION" = "$FILE" ] || { echo "tag ${GITHUB_REF_NAME} != VERSION ${FILE}"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # --- verify the committed manifest version matches the tag (release.sh sets it) ---
      - name: Check Cargo.toml version matches tag
        run: |
          CV="$(sed -nE 's/^version = "(.*)"/\1/p' Cargo.toml | head -1)"
          [ "$CV" = "$VERSION" ] || { echo "Cargo.toml version ${CV} != tag ${VERSION} (run release.sh)"; exit 1; }

      # --- build + test ---
      - name: Build (blocking + async)
        run: cargo build --all-features
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Tests + coverage gate
        run: bash run_tests.sh

      # --- package (version comes from the verified Cargo.toml) ---
      - name: Package (.crate)
        run: cargo package --all-features

      # --- verify ---
      - name: Verify artifact
        run: |
          ls -l target/package
          test -f "target/package/connpool-rs-${VERSION}.crate" || { echo "built crate is not version ${VERSION}"; exit 1; }

      # --- dry run: validate publishing without uploading ---
      - name: Publish dry run
        run: cargo publish --dry-run --all-features

      # --- publish: crates.io trusted publishing (OIDC) - exchange the GitHub OIDC token for a
      #     short-lived crates.io token right before the push; no stored secret ---
      - name: Authenticate to crates.io (OIDC)
        uses: rust-lang/crates-io-auth-action@v1
        id: crates-auth
      - name: Publish to crates.io
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}

      # Hand the packaged crate to the github-release job.
      - name: Upload artifacts for the GitHub Release
        uses: actions/upload-artifact@v4
        with:
          name: rust-dist
          path: rust/target/package/connpool-rs-${{ env.VERSION }}.crate

  # Attach every language's built artifacts to the GitHub Release for this tag, so users get
  # verifiable binaries.
  # Runs only after all publishes succeed; creates the release if it does not exist yet.
  github-release:
    needs: [python, dotnet, java, go, typescript, rust]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts        # -> artifacts/{python-dist,dotnet-dist,java-dist}/*

      - name: Create or update the GitHub Release with artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          mapfile -t FILES < <(find artifacts -type f | sort)
          echo "attaching ${#FILES[@]} file(s):"; printf '  %s\n' "${FILES[@]}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "${FILES[@]}" --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" --generate-notes
          fi
